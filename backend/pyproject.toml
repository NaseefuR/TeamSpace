[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "teamwork-platform"
version = "0.1.0"
description = "Async team and work management API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30", "sqlalchemy[asyncio]>=2.0.30",
  "asyncmy>=0.2.9", "pymysql>=1.1", "asyncpg>=0.29", "psycopg[binary]>=3.2",
  "alembic>=1.13", "pydantic>=2.8", "pydantic-settings>=2.4",
  "python-jose[cryptography]>=3.3", "pwdlib[argon2]>=0.2", "email-validator>=2.2",
  "python-multipart>=0.0.9",
  "httpx>=0.27", "numpy>=2.0", "pywebpush>=2.0,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "aiosqlite>=0.20", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["B008"]
